name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # POSIX only: AgileVow walks paths with O_NOFOLLOW
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  browser:
    name: browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.cjs
        env:
          TASK_BOARD_REVIEW_DIR: ${{ runner.temp }}/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: ${{ runner.temp }}/review
